<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0f19"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#e11d48"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="300"/><line x1="150" y1="0" x2="150" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="0" y1="50" x2="400" y2="50"/><line x1="0" y1="100" x2="400" y2="100"/><line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="200" x2="400" y2="200"/><line x1="0" y1="250" x2="400" y2="250"/>
  </g>
  <!-- Tetrominoes -->
  <!-- T-piece purple -->
  <rect x="150" y="80" width="46" height="46" rx="6" fill="url(#purple)" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="200" y="80" width="46" height="46" rx="6" fill="url(#purple)" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="250" y="80" width="46" height="46" rx="6" fill="url(#purple)" stroke="#e9d5ff" stroke-width="2"/>
  <rect x="200" y="30" width="46" height="46" rx="6" fill="url(#purple)" stroke="#e9d5ff" stroke-width="2"/>
  <!-- I-piece cyan -->
  <rect x="50" y="140" width="46" height="46" rx="6" fill="url(#cyan)" stroke="#a5f3fc" stroke-width="2"/>
  <rect x="50" y="190" width="46" height="46" rx="6" fill="url(#cyan)" stroke="#a5f3fc" stroke-width="2"/>
  <rect x="50" y="240" width="46" height="46" rx="6" fill="url(#cyan)" stroke="#a5f3fc" stroke-width="2"/>
  <!-- O-piece amber -->
  <rect x="250" y="180" width="46" height="46" rx="6" fill="url(#amber)" stroke="#fef08a" stroke-width="2"/>
  <rect x="300" y="180" width="46" height="46" rx="6" fill="url(#amber)" stroke="#fef08a" stroke-width="2"/>
  <rect x="250" y="230" width="46" height="46" rx="6" fill="url(#amber)" stroke="#fef08a" stroke-width="2"/>
  <rect x="300" y="230" width="46" height="46" rx="6" fill="url(#amber)" stroke="#fef08a" stroke-width="2"/>
  <!-- Z-piece rose -->
  <rect x="120" y="220" width="46" height="46" rx="6" fill="url(#rose)" stroke="#fecdd3" stroke-width="2"/>
  <rect x="170" y="220" width="46" height="46" rx="6" fill="url(#rose)" stroke="#fecdd3" stroke-width="2"/>
  <text x="200" y="285" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">TETRIS</text>
</svg>