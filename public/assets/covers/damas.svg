  <!-- Pieces -->
  <ellipse cx="170" cy="140" rx="26" ry="18" fill="url(#redpiece)" stroke="#fca5a5" stroke-width="3"/>
  <ellipse cx="170" cy="135" rx="20" ry="12" fill="#ef4444"/>
