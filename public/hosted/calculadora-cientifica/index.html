<script>
(function(){
  // ---------------- STATE ----------------
  let segments = [];   // {disp, val, closesParen(optional)}
  let history = "";
  let lastAnswer = 0;
  let memory = 0;
  let angleMode = "DEG"; // or RAD
  let secondMode = false;
  let justEvaluated = false;

  const exprLine = document.getElementById('exprLine');
  const resultLine = document.getElementById('resultLine');
  const indDeg = document.getElementById('ind-deg');
  const indRad = document.getElementById('ind-rad');
  const ind2nd = document.getElementById('ind-2nd');
  const indM = document.getElementById('ind-m');
  const angleSwitch = document.getElementById('angleSwitch');
  const secondBtn = document.getElementById('secondBtn');

  // ---------------- TOKENIZER ----------------
  function tokenize(str){
    const tokens = [];
    let i = 0;
    const FUNCS = ['asin','acos','atan','sin','cos','tan','sqrt','log','ln','abs'];
    while(i < str.length){
      const c = str[i];
      if(c === ' '){ i++; continue; }
      if(/[0-9.]/.test(c)){
        let j = i;
        while(j < str.length && /[0-9.]/.test(str[j])) j++;
        tokens.push({type:'num', value: parseFloat(str.slice(i,j))});
        i = j;
        continue;
      }
      if(/[a-zA-Z]/.test(c)){
        let j = i;
        while(j < str.length && /[a-zA-Z]/.test(str[j])) j++;
        let word = str.slice(i,j);
        // greedily match known identifiers even if concatenated (pi, e, ans, funcs)
        tokens.push({type:'ident', value: word});
        i = j;
        continue;
      }
      if('+-*/^()!%'.includes(c)){
        tokens.push({type:'op', value:c});
        i++;
        continue;
      }
      throw new Error("Caractere inválido: " + c);
    }
    return tokens;
  }

  // ---------------- PARSER ----------------
  function parseExpression(str){
    const tokens = tokenize(str);
    let pos = 0;

    function peek(){ return tokens[pos]; }
    function consume(){ return tokens[pos++]; }

    function canStartFactor(t){
      if(!t) return false;
      if(t.type === 'num' || t.type === 'ident') return true;
      if(t.type === 'op' && t.value === '(') return true;
      return false;
    }

    function parseAddSub(){
      let left = parseMulDiv();
      while(peek() && peek().type==='op' && (peek().value==='+' || peek().value==='-')){
        const op = consume().value;
        const right = parseMulDiv();
        left = (op==='+') ? left+right : left-right;
      }
      return left;
    }

    function parseMulDiv(){
      let left = parseUnary();
      while(true){
        const t = peek();
        if(t && t.type==='op' && (t.value==='*' || t.value==='/')){
          const op = consume().value;
          const right = parseUnary();
          left = (op==='*') ? left*right : left/right;
        } else if(canStartFactor(t)){
          // implicit multiplication
          const right = parseUnary();
          left = left*right;
        } else break;
      }
      return left;
    }

    function parseUnary(){
      const t = peek();
      if(t && t.type==='op' && (t.value==='+' || t.value==='-')){
        const op = consume().value;
        const val = parseUnary();
        return op==='-' ? -val : val;
      }
      return parsePow();
    }

    function parsePow(){
      let base = parsePostfix();
      const t = peek();
      if(t && t.type==='op' && t.value==='^'){
        consume();
        const exp = parseUnary();
        base = Math.pow(base, exp);
      }
      return base;
    }

    function parsePostfix(){
      let val = parsePrimary();
      while(true){
        const t = peek();
        if(t && t.type==='op' && t.value==='!'){
          consume();
          val = factorial(val);
        } else if(t && t.type==='op' && t.value==='%'){
          consume();
          val = val/100;
        } else break;
      }
      return val;
    }

    const CONST = {pi: Math.PI, e: Math.E};
    const FUNCS1 = {
      sin: (x)=> Math.sin(toRad(x)),
      cos: (x)=> Math.cos(toRad(x)),
      tan: (x)=> Math.tan(toRad(x)),
      asin: (x)=> fromRad(Math.asin(x)),
      acos: (x)=> fromRad(Math.acos(x)),
      atan: (x)=> fromRad(Math.atan(x)),
      sqrt: (x)=> Math.sqrt(x),
      log: (x)=> Math.log10(x),
      ln: (x)=> Math.log(x),
      abs: (x)=> Math.abs(x),
    };

    function parsePrimary(){
      const t = peek();
      if(!t) throw new Error("Expressão incompleta");
      if(t.type === 'num'){ consume(); return t.value; }
      if(t.type === 'op' && t.value === '('){
        consume();
        const v = parseAddSub();
        if(!(peek() && peek().type==='op' && peek().value===')')) throw new Error("Parêntese não fechado");
        consume();
        return v;
      }
      if(t.type === 'ident'){
        const name = t.value;
        if(name === 'pi' || name === 'e' || name === 'ans'){
          consume();
          if(name==='ans') return lastAnswer;
          return CONST[name];
        }
        if(FUNCS1[name]){
          consume();
          if(!(peek() && peek().type==='op' && peek().value==='(')) throw new Error("Função "+name+" requer parênteses");
          consume();
          const arg = parseAddSub();
          if(!(peek() && peek().type==='op' && peek().value===')')) throw new Error("Parêntese não fechado");
          consume();
          return FUNCS1[name](arg);
        }
        throw new Error("Identificador desconhecido: "+name);
      }
      throw new Error("Token inesperado");
    }

    const result = parseAddSub();
    if(pos < tokens.length) throw new Error("Expressão malformada");
    return result;
  }

  function toRad(x){ return angleMode==='DEG' ? x*Math.PI/180 : x; }
  function fromRad(x){ return angleMode==='DEG' ? x*180/Math.PI : x; }

  function factorial(n){
    if(n < 0 || !Number.isFinite(n)) return NaN;
    if(Math.abs(n - Math.round(n)) > 1e-9) return NaN; // only integers supported
    n = Math.round(n);
    if(n > 170) return Infinity;
    let r = 1;
    for(let k=2;k<=n;k++) r*=k;
    return r;
  }

  function formatNumber(n){
    if(Number.isNaN(n)) return "Erro";
    if(n === Infinity) return "∞";
    if(n === -Infinity) return "-∞";
    const abs = Math.abs(n);
    if(abs !== 0 && (abs < 1e-9 || abs >= 1e15)){
      return n.toExponential(6).replace(/e\+?(-?)(\d+)/, '×10^$1$2');
    }
    let s = parseFloat(n.toPrecision(12)).toString();
    return s;
  }

  // ---------------- DISPLAY ----------------
  function buildValueString(){
    return segments.map(s=>s.val).join('');
  }
  function render(){
    exprLine.textContent = history || '\u00A0';
    const dispStr = segments.map(s=>s.disp).join('') || '0';
    resultLine.textContent = dispStr;
    resultLine.classList.remove('error');
    exprLine.scrollLeft = exprLine.scrollWidth;
    resultLine.scrollLeft = resultLine.scrollWidth;
    ind2nd.classList.toggle('on', secondMode);
    indDeg.classList.toggle('on', angleMode==='DEG');
    indRad.classList.toggle('on', angleMode==='RAD');
    indM.classList.toggle('on', memory !== 0);
  }

  function pushSegment(disp, val){
    if(justEvaluated){
      // starting a fresh calculation after '='
      const startsWithOp = /^[+\-*/^!%)]/.test(val) === false ? false : true;
      if(!/^[)%!^*/+\-]/.test(val)){
        segments = [];
        history = "";
      }
      justEvaluated = false;
    }
    segments.push({disp, val});
    render();
  }

  function doAllClear(){
    segments = [];
    history = "";
    justEvaluated = false;
    render();
  }

  function doDelete(){
    segments.pop();
    justEvaluated = false;
    render();
  }

  function doEquals(){
    const raw = buildValueString();
    if(!raw) return;
    try{
      let toParse = raw;
      // auto-close any unclosed parens
      const opens = (toParse.match(/\(/g)||[]).length;
      const closes = (toParse.match(/\)/g)||[]).length;
      for(let k=0;k<opens-closes;k++) toParse += ')';
      const value = parseExpression(toParse);
      if(typeof value !== 'number' || Number.isNaN(value)){
        throw new Error("Erro");
      }
      history = segments.map(s=>s.disp).join('') + ' =';
      lastAnswer = value;
      const formatted = formatNumber(value);
      segments = [{disp: formatted, val: (Number.isFinite(value)? String(value) : '0')}];
      justEvaluated = true;
      render();
    }catch(err){
      history = segments.map(s=>s.disp).join('');
      resultLine.textContent = "Erro";
      resultLine.classList.add('error');
      justEvaluated = true;
      segments = [];
    }
  }

  function doNegate(){
    if(segments.length === 0) return;
    const val = buildValueString();
    const disp = segments.map(s=>s.disp).join('');
    segments = [{disp: '−('+disp+')', val: '-('+val+')'}];
    render();
  }

  function doMemory(act){
    if(act === 'mc'){ memory = 0; }
    else if(act === 'mr'){
      pushSegment(formatNumber(memory), String(memory));
      return;
    } else if(act === 'mplus'){
      try{
        const raw = buildValueString();
        let toParse = raw;
        const opens=(toParse.match(/\(/g)||[]).length, closes=(toParse.match(/\)/g)||[]).length;
        for(let k=0;k<opens-closes;k++) toParse += ')';
        const value = raw ? parseExpression(toParse) : lastAnswer;
        if(!Number.isNaN(value)) memory += value;
      }catch(e){ /* ignore */ }
    }
    render();
  }

  // ---------------- BUTTON WIRING ----------------
  document.querySelectorAll('.key').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const act = btn.dataset.act;
      if(act){
        if(act==='ac') doAllClear();
        else if(act==='del') doDelete();
        else if(act==='eq') doEquals();
        else if(act==='negate') doNegate();
        else if(act==='ans') pushSegment('Ans', 'ans');
        else if(act==='ee') pushSegment('E', '*10^(');
        else if(['mc','mr','mplus'].includes(act)) doMemory(act);
        return;
      }
      // regular value button, respect 2nd toggle
      let val = btn.dataset.val;
      let disp = btn.dataset.label || btn.textContent;
      if(secondMode && btn.dataset.altVal){
        val = btn.dataset.altVal;
        disp = btn.dataset.altLabel;
      }
      pushSegment(disp, val);
      if(secondMode && btn.dataset.altVal){
        secondMode = false; // one-shot like real calculators
      }
    });
  });

  secondBtn.addEventListener('click', ()=>{
    secondMode = !secondMode;
    secondBtn.classList.toggle('active', secondMode);
    render();
  });

  angleSwitch.addEventListener('click', ()=>{
    angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
    angleSwitch.classList.toggle('rad', angleMode==='RAD');
    render();
  });

  // ---------------- KEYBOARD SUPPORT ----------------
  window.addEventListener('keydown', (e)=>{
    const k = e.key;
    if(/[0-9.]/.test(k)){ pushSegment(k,k); return; }
    if(k==='+'){ pushSegment('+','+'); return; }
    if(k==='-'){ pushSegment('−','-'); return; }
    if(k==='*'){ pushSegment('×','*'); return; }
    if(k==='/'){ e.preventDefault(); pushSegment('÷','/'); return; }
    if(k==='^'){ pushSegment('^(','^('); return; }
    if(k==='('){ pushSegment('(','('); return; }
    if(k===')'){ pushSegment(')',')'); return; }
    if(k==='%'){ pushSegment('%','%'); return; }
    if(k==='Enter' || k==='='){ e.preventDefault(); doEquals(); return; }
    if(k==='Backspace'){ doDelete(); return; }
    if(k==='Escape'){ doAllClear(); return; }
  });

  render();
})();
</script>
</body>
</html>
